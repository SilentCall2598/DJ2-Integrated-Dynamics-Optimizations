    annotationProcessor 'com.google.code.gson:gson:2.8.9'

    pinnedCompileOnly files(pinnedDependencies.collect { dep -> new File(libsDir, "${configuredJars[dep.property]}") })
}

def sha256Of = { File f ->
    MessageDigest digest = MessageDigest.getInstance('SHA-256')
    f.withInputStream { stream ->
        byte[] buffer = new byte[65536]
        int read
        while ((read = stream.read(buffer)) != -1) {
            digest.update(buffer, 0, read)
        }
    }
    digest.digest().encodeHex().toString()
}

tasks.register('verifyLocalDependencies') {
    group = 'verification'
    description = 'Verifies the exact filename and SHA-256 of every pinned compile-only jar in libs/.'
    doLast {
        Set<String> present = ((libsDir.list() ?: new String[0]) as List<String>) as Set<String>
        List<String> problems = []
        List<String> verified = []
        pinnedDependencies.each { dep ->
            String configured = configuredJars[dep.property]
            if (!configured) {
                problems << "${dep.property} is not set in gradle.properties (expected ${dep.jar})"
            } else if (configured != dep.jar) {
                problems << "${dep.property} is ${configured} but the pinned dependency is ${dep.jar}"
            } else if (!present.contains(configured)) {
                problems << "libs/${configured} does not exist"
            } else {
                String actual = sha256Of(new File(libsDir, configured))
                if (actual != dep.sha256) {
                    problems << "SHA-256 mismatch for libs/${configured}\n" +
                            "      expected ${dep.sha256}\n" +
                            "      actual   ${actual}"
                } else {
                    verified << "libs/${configured}  SHA-256 ${actual}"
                }
            }
        }
        if (!problems.isEmpty()) {
            List<String> jars = present.findAll { it.endsWith('.jar') }.sort()
            throw new GradleException('Pinned dependency verification failed:\n  ' + problems.join('\n  ') +
                    '\nlibs/ currently holds: ' + (jars.isEmpty() ? '(no jars)' : jars.join(', ')) +
                    '\nNo jar was replaced, downloaded, renamed, or modified.')
        }
        verified.each { logger.lifecycle("Verified ${it}") }
        logger.lifecycle("All ${verified.size()} pinned dependency SHA-256 hashes matched.")
    }
}

tasks.named('compileJava') {
    dependsOn 'verifyLocalDependencies'
}

def modId = project.mod_id
def modName = project.mod_name
def modVersion = project.mod_version
def mcVersion = project.minecraft_version

tasks.register('verifyVersionConsistency') {
    group = 'verification'
    description = 'Verifies that Constants.VERSION exactly equals mod_version in gradle.properties.'
    def constants = file('src/main/java/idopt/core/Constants.java')
    doLast {
        if (!constants.isFile()) {
            throw new GradleException("Missing ${constants}")
        }
        List<String> values = (constants.getText('UTF-8') =~ /\bVERSION\s*=\s*"([^"]*)"\s*;/).collect { it[1] }
        if (values.size() != 1) {
            throw new GradleException("Expected exactly one VERSION string constant in ${constants}, found ${values.size()}")
        }
        if (values[0] != modVersion) {
            throw new GradleException("Constants.VERSION is \"${values[0]}\" but mod_version is \"${modVersion}\"")
        }
        logger.lifecycle("Constants.VERSION matches mod_version ${modVersion}")
    }
}

def projectRoot = projectDir
def hygieneRequiredFiles = ['README.md', 'LICENSE', '.gitignore', '.gitattributes', 'gradle.properties',
                            'gradle/wrapper/gradle-wrapper.properties', 'settings.gradle', 'build.gradle']
def hygieneRequiredTrees = ['src']
def hygieneOptionalTrees = ['tools']

tasks.register('verifyProjectHygiene') {
    group = 'verification'
    description = 'Rejects non-ASCII and control characters in project-owned source, build, and documentation files.'
    doLast {
        def relative = { File f -> projectRoot.toPath().relativize(f.toPath()).toString().replace('\\', '/') }
        List<String> problems = []
        Set<File> scanned = new TreeSet<File>()
        hygieneRequiredFiles.each { name ->
            File f = new File(projectRoot, name)
            if (f.isFile()) {
                scanned << f
            } else {
                problems << "${name} is missing"
            }
        }
        projectRoot.listFiles().findAll { it.isFile() && it.name.endsWith('.gradle') }.each { scanned << it }
        (hygieneRequiredTrees + hygieneOptionalTrees).each { name ->
            File dir = new File(projectRoot, name)
            if (dir.isDirectory()) {
                dir.eachFileRecurse(groovy.io.FileType.FILES) { scanned << it }
            } else if (hygieneRequiredTrees.contains(name)) {
                problems << "${name}/ is missing"
            }
        }
        scanned.each { f ->
            String text
            try {
                text = StandardCharsets.UTF_8.newDecoder()
                        .onMalformedInput(CodingErrorAction.REPORT)
                        .onUnmappableCharacter(CodingErrorAction.REPORT)
                        .decode(ByteBuffer.wrap(f.bytes)).toString()
            } catch (CharacterCodingException ignored) {
                problems << "${relative(f)}: not valid UTF-8"
                return
            }
            int line = 1
            int column = 0
            int offset = 0
            while (offset < text.length()) {
                int cp = text.codePointAt(offset)
                offset += Character.charCount(cp)
                if (cp == 0x0A) {
                    line++
                    column = 0
                    continue
                }
                column++
                if (cp == 0x0D || cp == 0x09) {
                    continue
                }
                if (cp < 0x20 || cp > 0x7E) {
                    problems << "${relative(f)}:${line}:${column}: U+${String.format('%04X', cp)}"
                }
            }
        }
        if (!problems.isEmpty()) {
            throw new GradleException('Project hygiene check failed:\n  ' + problems.join('\n  '))
        }
        logger.lifecycle("Scanned ${scanned.size()} project-owned files: all printable ASCII.")
        scanned.each { logger.info("  ${relative(it)}") }
    }
}

