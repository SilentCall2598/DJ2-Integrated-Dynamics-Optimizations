def libsDir = file('libs')
def configuredJars = pinnedDependencies.collectEntries { dep ->
    [(dep.property): project.findProperty(dep.property)?.toString()?.trim()]
}

configurations {
    pinnedCompileOnly
    compileOnly.extendsFrom(pinnedCompileOnly)
}

dependencies {
