def reobfJarTask = tasks.named('reobfJar', AbstractArchiveTask)
def releaseJarFile = reobfJarTask.flatMap { it.archiveFile }
def releaseArchivesName = base.archivesName
def pinnedJarFiles = pinnedDependencies.collect { dep -> new File(libsDir, dep.jar) }
def modPackageRoot = 'idopt/'
def requiredModEntries = ['META-INF/MANIFEST.MF', 'mcmod.info',
                          'idopt/IntegratedDynamicsOptimizations.class', 'idopt/core/Constants.class']
def nonReleaseRootDirs = ['references/', 'logs/', 'run/', 'tools/', 'libs/', 'build/', 'src/', 'gradle/']
def nonReleaseFileNames = ['gradlew', 'build.gradle', 'settings.gradle', 'gradle.properties', 'LICENSE']
def nonReleaseSuffixes = ['.bat', '.cmd', '.log', '.md']
def nestedArchiveSuffixes = ['.jar', '.zip', '.war', '.ear', '.jmod']
def attributionKeys = ['authorList', 'authors', 'author', 'credits']
def java8ClassMajor = 52

tasks.register('auditReleaseJar') {
    group = 'verification'
    description = 'Audits the reobfuscated release jar contents, metadata, and bytecode level and prints its SHA-256.'
    dependsOn reobfJarTask
    doLast {
        File artifact = releaseJarFile.get().asFile
        String expectedName = "${releaseArchivesName.get()}-${modVersion}.jar"
        List<String> problems = []
        if (!artifact.isFile()) {
            throw new GradleException("Release jar ${artifact} does not exist")
        }
        if (artifact.name != expectedName) {
            problems << "release jar is named ${artifact.name}, expected ${expectedName}"
        }

        Map<String, String> thirdPartyPrefixes = [:]
        Map<String, String> thirdPartyExact = [:]
        pinnedJarFiles.each { jf ->
            if (!jf.isFile()) {
                throw new GradleException("Pinned jar ${jf} is missing; the third-party ownership check cannot run")
            }
            int ownedClasses = 0
            new ZipFile(jf).withCloseable { zip ->
                zip.entries().each { entry ->
                    String n = entry.name
                    if (entry.directory || n.startsWith('META-INF/')) {
                        return
                    }
                    if (n.endsWith('.class')) {
                        ownedClasses++
                        int slash = n.lastIndexOf('/')
                        if (slash < 0) {
                            thirdPartyExact.putIfAbsent(n, jf.name)
                        } else {
                            thirdPartyPrefixes.putIfAbsent(n.substring(0, slash + 1), jf.name)
                        }
                    } else if (n.startsWith('assets/') && n.indexOf('/', 7) > 7) {
                        thirdPartyPrefixes.putIfAbsent(n.substring(0, n.indexOf('/', 7) + 1), jf.name)
                    }
                }
            }
            if (ownedClasses == 0) {
                throw new GradleException("Pinned jar ${jf.name} contains no classes; the third-party ownership check cannot run")
            }
        }

        Set<String> entryNames = new LinkedHashSet<String>()
        String manifestTitle = null
        String manifestVersion = null
        String modInfoText = null
        int modClassCount = 0
        int maxClassMajor = 0
        new ZipFile(artifact).withCloseable { zip ->
            zip.entries().each { entry ->
                String n = entry.name
                if (!entryNames.add(n)) {
                    problems << "duplicate entry ${n}"
                }
                String lower = n.toLowerCase(Locale.ROOT)
                String fileName = n.endsWith('/') ? '' : n.substring(n.lastIndexOf('/') + 1)
                String owner = thirdPartyExact[n]
                if (owner == null) {
                    owner = thirdPartyPrefixes.find { prefix, jarName -> n.startsWith(prefix) }?.value
                }
                if (owner != null) {
                    problems << "third-party entry ${n} belongs to ${owner}"
                }
                if (nestedArchiveSuffixes.any { lower.endsWith(it) } || lower.startsWith('meta-inf/jarjar/') ||
                        lower.startsWith('meta-inf/libraries/')) {
                    problems << "embedded archive ${n}"
                }
                if (n.split('/').any { it.startsWith('.') }) {
                    problems << "hidden file or directory ${n}"
                }
                if (nonReleaseRootDirs.any { n.startsWith(it) } || nonReleaseFileNames.contains(fileName) ||
                        nonReleaseSuffixes.any { lower.endsWith(it) }) {
                    problems << "local-only or build file ${n}"
                }
                boolean isModEntry = n.startsWith(modPackageRoot)
                boolean allowed = n == 'META-INF/' || n == 'META-INF/MANIFEST.MF' || n == 'mcmod.info' ||
                        (isModEntry && (n.endsWith('/') || n.endsWith('.class')))
                if (!allowed) {
                    problems << "unexpected entry ${n}"
                }
                if (isModEntry && n.endsWith('.class')) {
                    modClassCount++
                    String simpleName = fileName.substring(0, fileName.length() - 6)
                    int nested = simpleName.indexOf('$')
                    String outerName = nested < 0 ? simpleName : simpleName.substring(0, nested)
                    if (outerName.endsWith('Test') || outerName.endsWith('Tests') || n.contains('/test/') ||
                            n.contains('/tests/') || n.contains('/tools/')) {
                        problems << "test or tool class ${n}"
                    }
                    byte[] header = new byte[8]
                    int headerRead = 0
                    zip.getInputStream(entry).withCloseable { stream ->
                        int r
                        while (headerRead < 8 && (r = stream.read(header, headerRead, 8 - headerRead)) != -1) {
                            headerRead += r
                        }
                    }
                    long magic = ((header[0] & 0xFFL) << 24) | ((header[1] & 0xFFL) << 16) |
                            ((header[2] & 0xFFL) << 8) | (header[3] & 0xFFL)
                    int major = ((header[6] & 0xFF) << 8) | (header[7] & 0xFF)
                    if (headerRead < 8 || magic != 0xCAFEBABEL) {
                        problems << "invalid class file ${n}"
                    } else {
                        maxClassMajor = Math.max(maxClassMajor, major)
                        if (major > java8ClassMajor) {
                            problems << "class ${n} has major version ${major}, above Java 8 (${java8ClassMajor})"
                        }
                    }
                }
                if (n == 'META-INF/MANIFEST.MF') {
                    zip.getInputStream(entry).withCloseable { stream ->
                        def attributes = new Manifest(stream).mainAttributes
                        manifestTitle = attributes.getValue('Implementation-Title')
                        manifestVersion = attributes.getValue('Implementation-Version')
                    }
                }
                if (n == 'mcmod.info') {
                    modInfoText = zip.getInputStream(entry).withCloseable { it.getText('UTF-8') }
                }
            }
        }

        requiredModEntries.findAll { !entryNames.contains(it) }.each { problems << "missing required entry ${it}" }
        if (manifestVersion != modVersion) {
            problems << "manifest Implementation-Version is ${manifestVersion}, expected ${modVersion}"
        }
        if (manifestTitle != modName) {
            problems << "manifest Implementation-Title is ${manifestTitle}, expected ${modName}"
        }
        if (modInfoText != null) {
            if (modInfoText.contains('${')) {
                problems << 'mcmod.info contains unexpanded placeholders'
            }
            def modInfo = null
            try {
                modInfo = new JsonSlurper().parseText(modInfoText)
            } catch (Exception e) {
                problems << "mcmod.info is not valid JSON: ${e.message}"
            }
            if (modInfo != null) {
                if (!(modInfo instanceof List) || modInfo.size() != 1 || !(modInfo[0] instanceof Map)) {
                    problems << 'mcmod.info must hold exactly one mod entry'
                } else {
                    Map info = (Map) modInfo[0]
                    [modid: modId, name: modName, version: modVersion, mcversion: mcVersion].each { key, expected ->
                        if (info[key] != expected) {
                            problems << "mcmod.info ${key} is ${info[key]}, expected ${expected}"
                        }
                    }
                    attributionKeys.findAll { info.containsKey(it) }.each { problems << "mcmod.info has attribution key ${it}" }
                }
            }
        }

        if (!problems.isEmpty()) {
            throw new GradleException("Release jar audit failed for ${artifact.name}:\n  " + problems.join('\n  '))
        }
        logger.lifecycle("Release jar audit passed: ${entryNames.size()} entries, ${modClassCount} classes, " +
                "max class major version ${maxClassMajor}")
        logger.lifecycle("Jar     ${artifact.name}")
        logger.lifecycle("Bytes   ${artifact.length()}")
        logger.lifecycle("SHA-256 ${sha256Of(artifact)}")
    }
}

tasks.named('check') {
    dependsOn 'verifyVersionConsistency', 'verifyProjectHygiene', 'auditReleaseJar'
}

